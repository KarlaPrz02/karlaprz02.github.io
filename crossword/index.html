<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crucigrama básico</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="crossword-app">
    <section class="box">
      <h1>Crucigrama básico</h1>
      <div id="crossword-grid" class="grid" aria-label="Tablero de crucigrama"></div>
      <p class="help">Haz clic en una celda y escribe una letra. Solo letras A-Z.</p>
    </section>

    <aside class="box clues">
      <div>
        <h3>Horizontal</h3>
        <div class="clue"><strong>1.</strong> Planea o dibuja el camino (6)</div>
        <div class="clue"><strong>4.</strong> Lo opuesto de "alto" (4)</div>
        <div class="clue"><strong>7.</strong> Comida típica italiana (5)</div>
      </div>
      <div>
        <h3>Vertical</h3>
        <div class="clue"><strong>1.</strong> Fruta amarilla, alargada (6)</div>
        <div class="clue"><strong>2.</strong> Movimiento de agua en el mar (4)</div>
        <div class="clue"><strong>5.</strong> Día después del lunes (7)</div>
      </div>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
